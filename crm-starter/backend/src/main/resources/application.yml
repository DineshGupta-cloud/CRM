server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: crmuser
    password: crmpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: myVeryStrongSecretKeyForCRMApp1234567890
  expiration: 86400000
